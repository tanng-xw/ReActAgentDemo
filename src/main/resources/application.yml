server:
  port: 8081

# 企业内网 SSL 配置
# 如果内网有 SSL 拦截代理或自签名证书，设置为 true 以禁用 SSL 验证
# 警告：仅在受信任的内网环境使用
app:
  ssl:
    insecure: false

spring:
  ai:
    openai:
      api-key: sk-22005f4049f34413bb450cb3cb692ebb
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2000

logging:
  level:
    com.react.agentdemo: INFO
    org.springframework.ai: INFO
    com: ERROR
    org: ERROR
  file:
    name: logs/app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
