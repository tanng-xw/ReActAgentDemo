<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能音乐助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e8ecf1;
        }

        .chat-header {
            background: #ffffff;
            color: #1a1a2e;
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid #e8ecf1;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .session-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #fafbfc;
            border-bottom: 1px solid #e8ecf1;
            font-size: 12px;
            color: #6b7280;
        }

        .session-id {
            font-family: monospace;
        }

        .btn-clear {
            padding: 4px 12px;
            background: #f3f4f6;
            color: #6b7280;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .message-user .message-bubble {
            background: #4a90e2;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-assistant .message-bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .thinking-section {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-left: 3px solid #9ca3af;
            display: flex;
            align-items: center;
            color: #4b5563;
            font-size: 14px;
        }

        .thinking-section::before {
            content: "🤔";
            margin-right: 10px;
            font-size: 16px;
        }

        .tool-call-section {
            background: #ecfdf5;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-left: 3px solid #10b981;
            color: #065f46;
            font-size: 14px;
        }

        .tool-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .tool-header::before {
            content: "🔧";
            margin-right: 8px;
            font-size: 16px;
        }

        .tool-arguments, .tool-result {
            margin-top: 6px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .tool-label {
            font-weight: 600;
            color: #047857;
            margin-right: 4px;
        }

        .final-answer-section {
            background: #f8faff;
            border-radius: 18px;
            padding: 16px;
            border: 1px solid #4a90e2;
            border-bottom-left-radius: 4px;
        }

        .final-answer-header {
            color: #4a90e2;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .final-answer-content {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* 流式消息样式 */
        .streaming-section {
            background: linear-gradient(135deg, #f0f7ff 0%, #e6f0ff 100%);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid #4a90e2;
            border-bottom-left-radius: 4px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { border-color: #4a90e2; }
            50% { border-color: #7fb3e8; }
            100% { border-color: #4a90e2; }
        }

        .streaming-header {
            color: #4a90e2;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .streaming-header::after {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4a90e2;
            border-radius: 50%;
            margin-left: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .streaming-content {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e8ecf1;
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #f9fafb;
        }

        .input-field:hover {
            border-color: #9ca3af;
        }

        .input-field:focus {
            border-color: #4a90e2;
        }

        .btn-send {
            padding: 12px 24px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-send:hover {
            background: #357abd;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .btn-send:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .typing-indicator {
            display: none;
            padding: 15px;
            color: #6c757d;
            font-size: 14px;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #4a90e2;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #dc3545;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .welcome-message h2 {
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .suggestion-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #d0d7de;
            color: #4a5568;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: #4a90e2;
            border-color: #4a90e2;
            color: white;
        }

        /* 滚动条样式 */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🎵 智能音乐助手</h1>
            <p>支持多轮对话和工具调用的智能助手</p>
        </div>
        
        <div class="session-info">
            <span>会话ID: <span class="session-id" id="sessionId">-</span></span>
            <button class="btn-clear" onclick="clearSession()">清除会话</button>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message">
                <h2>👋 欢迎使用智能音乐助手</h2>
                <p>我可以帮您查询天气、搜索歌曲、了解您的位置等信息</p>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="setInput('今天天气怎么样？')">查询天气</button>
                    <button class="suggestion-btn" onclick="setInput('搜索周杰伦的歌曲')">搜索歌曲</button>
                    <button class="suggestion-btn" onclick="setInput('我在哪个城市？')">查询位置</button>
                    <button class="suggestion-btn" onclick="setInput('推荐几首好听的歌曲')">推荐歌曲</button>
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            助手正在思考
            <span class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </div>
        
        <div class="input-container">
            <input type="text" class="input-field" id="inputField" 
                   placeholder="输入您的问题..." 
                   onkeypress="handleKeyPress(event)">
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // 会话ID
        let sessionId = localStorage.getItem('chatSessionId');
        if (!sessionId) {
            sessionId = generateSessionId();
            localStorage.setItem('chatSessionId', sessionId);
        }
        document.getElementById('sessionId').textContent = sessionId.substring(0, 8) + '...';

        // 当前消息容器（用于追加内容）
        let currentThinkingDiv = null;
        let currentFinalAnswerDiv = null;
        let isProcessing = false;

        // 生成会话ID
        function generateSessionId() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 设置输入框内容
        function setInput(text) {
            document.getElementById('inputField').value = text;
            document.getElementById('inputField').focus();
        }

        // 处理键盘事件
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 发送消息
        async function sendMessage() {
            const inputField = document.getElementById('inputField');
            const message = inputField.value.trim();
            
            if (!message || isProcessing) {
                return;
            }

            // 清除欢迎消息
            const container = document.getElementById('messagesContainer');
            if (container.querySelector('.welcome-message')) {
                container.innerHTML = '';
            }

            // 添加用户消息
            addUserMessage(message);
            inputField.value = '';
            
            // 设置处理状态
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('typingIndicator').classList.add('active');

            // 重置当前消息容器
            currentThinkingDiv = null;
            currentFinalAnswerDiv = null;

            try {
                // 发送请求
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error('网络请求失败: ' + response.status);
                }

                // 处理 SSE 流
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const data = line.substring(5).trim();
                            if (data) {
                                handleStreamData(data);
                            }
                        }
                    }
                }

                // 处理剩余缓冲
                if (buffer.includes('data:')) {
                    const data = buffer.substring(buffer.indexOf('data:') + 5).trim();
                    if (data) {
                        handleStreamData(data);
                    }
                }

            } catch (error) {
                console.error('发送消息失败:', error);
                addErrorMessage('发送消息失败: ' + error.message);
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('typingIndicator').classList.remove('active');
                currentThinkingDiv = null;
                currentFinalAnswerDiv = null;
            }
        }

        // 处理流数据
        // 当前流式消息元素
        let currentStreamingElement = null;
        
        function handleStreamData(data) {
            try {
                const response = JSON.parse(data);
                
                switch (response.type) {
                    case 'THINKING':
                        appendThinking(response.content);
                        break;
                    case 'STREAMING':
                        appendStreamingContent(response.content);
                        break;
                    case 'TOOL_CALL':
                        addToolCallMessage(response.toolName, response.toolArguments, response.toolResult);
                        break;
                    case 'FINAL_ANSWER':
                        // 如果已经显示了流式内容，只需更新标题和样式
                        // 避免重复显示相同内容
                        if (currentStreamingElement) {
                            finalizeStreamingAnswer(response.content);
                        } else {
                            addFinalAnswer(response.content);
                        }
                        // 流式结束，重置当前流式元素
                        currentStreamingElement = null;
                        break;
                    case 'ERROR':
                        addErrorMessage(response.error);
                        currentStreamingElement = null;
                        break;
                }
            } catch (e) {
                console.error('解析响应失败:', e, data);
            }
        }

        // 追加流式内容
        function appendStreamingContent(content) {
            const container = document.getElementById('messagesContainer');
            
            // 隐藏"正在思考"指示器，因为开始收到内容了
            document.getElementById('typingIndicator').classList.remove('active');
            
            if (!currentStreamingElement) {
                // 标记当前思考框为已完成
                completeCurrentThinking();
                
                // 创建新的流式消息框
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message message-assistant';
                messageDiv.innerHTML = `
                    <div class="streaming-section">
                        <div class="streaming-header">💭 正在回答</div>
                        <div class="streaming-content"></div>
                    </div>
                `;
                container.appendChild(messageDiv);
                currentStreamingElement = messageDiv.querySelector('.streaming-content');
                scrollToBottom();
            }
            
            // 追加内容
            currentStreamingElement.textContent += content;
            scrollToBottom();
        }

        // 添加用户消息
        function addUserMessage(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message message-user';
            messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(message)}</div>`;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        // 添加思考内容（追加到当前思考框，或创建新的）
        function appendThinking(content) {
            const container = document.getElementById('messagesContainer');
            
            // 查找最后一个思考框（如果没有被工具调用或最终答案打断）
            const lastElement = container.lastElementChild;
            if (lastElement && lastElement.classList.contains('thinking-section') && !lastElement.dataset.completed) {
                // 追加到现有思考框
                lastElement.textContent += content;
            } else {
                // 创建新的思考框
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'thinking-section';
                thinkingDiv.textContent = content;
                container.appendChild(thinkingDiv);
                currentThinkingDiv = thinkingDiv;
            }
            scrollToBottom();
        }
        
        // 标记当前思考框为已完成（遇到工具调用或最终答案时调用）
        function completeCurrentThinking() {
            const container = document.getElementById('messagesContainer');
            const lastElement = container.lastElementChild;
            if (lastElement && lastElement.classList.contains('thinking-section')) {
                lastElement.dataset.completed = 'true';
            }
            currentThinkingDiv = null;
        }

        // 添加工具调用消息
        function addToolCallMessage(toolName, toolArguments, toolResult) {
            const container = document.getElementById('messagesContainer');
            
            // 标记当前思考框为已完成
            completeCurrentThinking();
            
            // 查找是否已存在相同工具名称的调用框（用于更新结果）
            const existingToolDiv = Array.from(container.querySelectorAll('.tool-call-section')).find(
                div => div.dataset.toolName === toolName && !div.dataset.hasResult
            );
            
            if (existingToolDiv && toolResult) {
                // 更新现有工具框，添加结果
                const resultDiv = document.createElement('div');
                resultDiv.className = 'tool-result';
                resultDiv.innerHTML = `<span class="tool-label">结果:</span> ${escapeHtml(toolResult)}`;
                existingToolDiv.appendChild(resultDiv);
                existingToolDiv.dataset.hasResult = 'true';
            } else if (!existingToolDiv) {
                // 创建新的工具调用框
                const toolDiv = document.createElement('div');
                toolDiv.className = 'tool-call-section';
                toolDiv.dataset.toolName = toolName;
                
                let html = `<div class="tool-header">🔧 调用 ${escapeHtml(toolName)}</div>`;
                
                if (toolArguments) {
                    html += `<div class="tool-arguments"><span class="tool-label">参数:</span> ${escapeHtml(toolArguments)}</div>`;
                }
                
                if (toolResult) {
                    html += `<div class="tool-result"><span class="tool-label">结果:</span> ${escapeHtml(toolResult)}</div>`;
                    toolDiv.dataset.hasResult = 'true';
                }
                
                toolDiv.innerHTML = html;
                container.appendChild(toolDiv);
            }
            
            scrollToBottom();
        }

        // 添加最终答案
        function addFinalAnswer(content) {
            const container = document.getElementById('messagesContainer');
            
            // 标记当前思考框为已完成
            completeCurrentThinking();
            
            const answerDiv = document.createElement('div');
            answerDiv.className = 'message message-assistant';
            answerDiv.innerHTML = `
                <div class="final-answer-section">
                    <div class="final-answer-header">💡 回答</div>
                    <div class="final-answer-content">${escapeHtml(content)}</div>
                </div>
            `;
            container.appendChild(answerDiv);
            scrollToBottom();
        }

        // 将流式回答转为最终答案（避免重复显示）
        function finalizeStreamingAnswer(finalContent) {
            if (!currentStreamingElement) return;
            
            // 找到流式消息的父元素
            const streamingSection = currentStreamingElement.closest('.streaming-section');
            if (streamingSection) {
                // 更新为最终答案样式
                streamingSection.className = 'final-answer-section';
                streamingSection.innerHTML = `
                    <div class="final-answer-header">💡 回答</div>
                    <div class="final-answer-content">${escapeHtml(finalContent)}</div>
                `;
            }
            currentStreamingElement = null;
            scrollToBottom();
        }

        // 添加错误消息
        function addErrorMessage(error) {
            const container = document.getElementById('messagesContainer');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = '❌ ' + error;
            container.appendChild(errorDiv);
            scrollToBottom();
        }

        // 滚动到底部
        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 清除会话
        function clearSession() {
            if (confirm('确定要清除当前会话吗？这将删除所有聊天记录。')) {
                localStorage.removeItem('chatSessionId');
                sessionId = generateSessionId();
                localStorage.setItem('chatSessionId', sessionId);
                document.getElementById('sessionId').textContent = sessionId.substring(0, 8) + '...';
                
                // 清空消息容器
                const container = document.getElementById('messagesContainer');
                container.innerHTML = `
                    <div class="welcome-message">
                        <h2>👋 欢迎使用智能音乐助手</h2>
                        <p>我可以帮您查询天气、搜索歌曲、了解您的位置等信息</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" onclick="setInput('今天天气怎么样？')">查询天气</button>
                            <button class="suggestion-btn" onclick="setInput('搜索周杰伦的歌曲')">搜索歌曲</button>
                            <button class="suggestion-btn" onclick="setInput('我在哪个城市？')">查询位置</button>
                            <button class="suggestion-btn" onclick="setInput('推荐几首好听的歌曲')">推荐歌曲</button>
                        </div>
                    </div>
                `;
            }
        }

        // 页面加载完成后聚焦输入框
        window.onload = function() {
            document.getElementById('inputField').focus();
        };

        // 页面刷新前提醒
        window.onbeforeunload = function() {
            if (isProcessing) {
                return '正在处理中，确定要离开吗？';
            }
        };
    </script>
</body>
</html>
